<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación de Boda</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jorgeadrianawed.github.io/wedinvitation/">
    <meta property="og:title" content="Invitacion de boda Jorge y Adriana">
    <meta property="og:image" content="https://jorgeadrianawed.github.io/wedinvitation/preview.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .fade-transition {
            transition: opacity 0.8s ease-in-out;
        }

        .responsive-media {
            object-fit: contain; 
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        @media (max-width: 768px), (orientation: portrait) {
            .responsive-media {
                object-fit: cover;
                height: 100dvh;
            }
        }
    </style>
</head>
<body class="relative bg-black select-none">

    <!-- CANVAS VISIBLE (Z-10) -->
    <canvas id="video-canvas" class="absolute inset-0 responsive-media z-10"></canvas>

    <!-- IMAGEN DE POSTER (Z-20: Actúa como escudo hasta que el video arranque de verdad) -->
    <img id="poster-img" src="primer_fotograma.jpeg" class="absolute inset-0 responsive-media z-20" alt="Fondo">

    <!-- VIDEO REAL OCULTO FUERA DE LA PANTALLA -->
    <video 
        id="main-video" 
        class="fixed -top-[9999px] -left-[9999px] w-1 h-1 opacity-0 pointer-events-none z-0" 
        playsinline 
        webkit-playsinline 
        preload="auto"
        disablePictureInPicture 
        disableRemotePlayback 
        controlsList="nofullscreen nodownload noremoteplayback noplaybackrate">
        <source src="video_principal.mp4" type="video/mp4">
    </video>

    <!-- CAPA DEL BOTÓN INVISIBLE CENTRAL (Es decir del sello) -->
    <div id="cover-screen" class="absolute inset-0 w-full h-full z-30 flex items-center justify-center">
        <div id="seal-btn" class="w-32 h-32 cursor-pointer bg-transparent rounded-full" style="-webkit-tap-highlight-color: transparent;"></div>
        <p class="absolute bottom-[22%] text-white/70 text-xs sm:text-sm tracking-[0.3em] uppercase font-serif pointer-events-none select-none animate-pulse">
            Toca el sello para abrir
        </p>
    </div>

    <!-- BOTÓN -->
    <div id="action-btn-container" class="absolute bottom-32 left-0 w-full flex justify-center z-50 opacity-0 pointer-events-none fade-transition">
        <button id="details-btn" class="px-8 py-3 bg-white bg-opacity-20 backdrop-blur-md border border-white/50 text-white text-lg rounded-full shadow-[0_0_15px_rgba(255,255,255,0.3)] hover:bg-white hover:text-black transition-all duration-300 tracking-widest uppercase text-sm">
            Más detalles
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const coverScreen = document.getElementById('cover-screen');
            const sealBtn = document.getElementById('seal-btn');
            const mainVideo = document.getElementById('main-video');
            const posterImg = document.getElementById('poster-img');
            const actionBtnContainer = document.getElementById('action-btn-container');
            const detailsBtn = document.getElementById('details-btn');
            
            // Variables para el Canvas
            const canvas = document.getElementById('video-canvas');
            const ctx = canvas.getContext('2d');
            let animationFrameId;
            let buttonShown = false;
            let firstFrameDrawn = false; // Control de seguridad para el parpadeo

            // Evitar menú contextual
            window.addEventListener('contextmenu', (e) => e.preventDefault(), { passive: false });

            // Configurar el tamaño interno del canvas cuando el video cargue su información
            mainVideo.addEventListener('loadedmetadata', () => {
                canvas.width = mainVideo.videoWidth;
                canvas.height = mainVideo.videoHeight;
            });

            // Función para dibujar el video en el canvas fotograma a fotograma
            const renderVideoFrame = () => {
                if (!mainVideo.paused && !mainVideo.ended) {
                    ctx.drawImage(mainVideo, 0, 0, canvas.width, canvas.height);
                }
                animationFrameId = requestAnimationFrame(renderVideoFrame);
            };

            // Iniciar reproducción
            sealBtn.addEventListener('click', () => {
                coverScreen.style.display = 'none'; // Se oculta el sello, pero el póster sigue cubriendo todo
                
                mainVideo.play().then(() => {
                    renderVideoFrame(); // Inicia el dibujo (invisible detrás del póster temporalmente)
                }).catch(err => console.log("Error de reproducción:", err));
            });

            // Control de tiempo, parpadeo y botones
            mainVideo.addEventListener('timeupdate', () => {
                if (!mainVideo.duration) return;

                const currentTime = mainVideo.currentTime;
                const duration = mainVideo.duration;
                const LOOP_START_TIME = duration - 12;
                const timeLeft = duration - currentTime;
                
                if (!firstFrameDrawn && currentTime > 0.05) {
                    posterImg.style.display = 'none';
                    firstFrameDrawn = true;
                }

                // Mostrar botón de más detalles
                if (timeLeft <= 17 && !buttonShown) {
                    buttonShown = true;
                    actionBtnContainer.style.opacity = '1';
                    actionBtnContainer.style.pointerEvents = 'auto'; 
                }

                // Loop video
                if (currentTime >= duration) {
                    mainVideo.currentTime = LOOP_START_TIME;
                    mainVideo.play(); 
                }
            });

            detailsBtn.addEventListener('click', () => {
                window.location.href = "https://wedproject-lilac.vercel.app/";
            });
        });
    </script>
</body>
</html>
